<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>دليل قريتي - اختبار</title>
<style>
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background:#f5f7f4; color:#1d2b22; }
  header { background:#1f7a4d; color:#fff; padding:20px 16px; text-align:center; }
  header h1 { margin:0; font-size:1.5rem; }
  main { padding:16px; max-width:480px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .badge { padding:4px 12px; border-radius:99px; font-weight:bold; font-size:.9rem; }
  .on { background:#d7f2e1; color:#14693c; }
  .off { background:#fde2e0; color:#a12720; }
  .wait { background:#eee; color:#555; }
</style>
</head>
<body>
<header><h1>دليل قريتي</h1><div>صفحة اختبار المرحلة 0</div></header>
<main>
  <div class="card">
    <div class="row"><span>حالة الاتصال</span><span id="net" class="badge wait">...</span></div>
  </div>
  <div class="card">
    <div class="row"><span>جاهزية العمل دون إنترنت</span><span id="sw" class="badge wait">...</span></div>
  </div>
  <div class="card">
    <div class="row"><span>يعمل كتطبيق مثبّت</span><span id="inst" class="badge wait">...</span></div>
  </div>
  <div class="card">
    <p>إن ظهرت الحالات الثلاث بالأخضر بعد التثبيت، ونجح فتح الصفحة بعد قطع الإنترنت، فالمرحلة 0 اكتملت.</p>
  </div>
</main>
<script>
  function setBadge(id, ok, yes, no) {
    var el = document.getElementById(id);
    el.textContent = ok ? yes : no;
    el.className = "badge " + (ok ? "on" : "off");
  }
  function updateNet() { setBadge("net", navigator.onLine, "متصل", "غير متصل"); }
  window.addEventListener("online", updateNet);
  window.addEventListener("offline", updateNet);
  updateNet();

  var standalone = window.matchMedia("(display-mode: standalone)").matches;
  setBadge("inst", standalone, "نعم", "لا (يعمل في المتصفح)");

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(function () {
      return navigator.serviceWorker.ready;
    }).then(function () {
      setBadge("sw", true, "جاهز", "غير جاهز");
    }).catch(function () {
      setBadge("sw", false, "جاهز", "فشل التفعيل");
    });
  } else {
    setBadge("sw", false, "جاهز", "غير مدعوم في هذا المتصفح");
  }
</script>
</body>
</html>
